[package]
name = "compression"
version = "0.1.0"
description = "Masaüstü dosya sıkıştırma uygulaması"
edition = "2021"

[lib]
name = "compression_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
lopdf = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
flate2 = "1"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
webp = { version = "0.3", default-features = false }
color_quant = "1.1"

# Görsel çözme/kodlama optimizasyonsuz derlemede ~25 kat yavaş; `tauri dev`
# sırasında da bağımlılıklar optimize derlenir.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
